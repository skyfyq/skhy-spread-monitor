services:
  - type: web
    name: skhy-spread-monitor
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python server.py"
    healthCheckPath: /
    envVars:
      - key: HOST
        value: "0.0.0.0"
      # REST origin only. Live quotes use the Binance /market/stream websocket
      # because this region's shared egress is often HTTP 418 banned on REST.
      # Optional overrides (set in the dashboard, do not commit secrets):
      # BINANCE_WS_URL, BINANCE_PROXY, HTTPS_PROXY.
      - key: BINANCE_FAPI_BASE
        value: "https://www.binance.com"
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Optional email alerts — set these in Render dashboard (do not commit secrets)
      - key: ALERT_ENABLED
        value: "false"
      - key: ALERT_TO
        sync: false
      - key: SMTP_HOST
        value: "smtp.163.com"
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SSL
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
